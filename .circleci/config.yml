version: 2.1

# CI/CD for the two npm packages built here: @dmarket/p2p-tracker-core (the :core Kotlin/JS library
# distribution, for the web extension) and @dmarket/p2p-tracker-headless (the :headless-js one, for Node.js
# hosts). They are released together: one VERSION_NAME, one release branch, one approval, and for a stable
# version one tag and one GitHub Release covering both.
#
# Release model: a release BRANCH plus a human approval — mirroring the extension repository, so one
# mental model covers both halves of the plugin. `main` publishes nothing: merging there is merging,
# not shipping. A release is proposed by pushing `release/v<x.y.z>` (VERSION_NAME in gradle.properties
# must equal that exact string) and happens when someone approves `hold_release`.
#
# The version string still decides the channel, the same for both packages:
#   - "<x.y.z>-SNAPSHOT"  -> npm prerelease "<x.y.z>-SNAPSHOT.<commits>" under dist-tag "snapshot"
#                            (no tag / no GitHub Release). Branch: `release/v<x.y.z>-SNAPSHOT`.
#   - "<x.y.z>"           -> npm "latest" + annotated tag v<x.y.z> + GitHub Release from CHANGELOG.
#
# Both come from main: publish_npm refuses a release branch whose commit main does not have. A branch other
# than main publishes only a snapshot named after it: branch `release/v<x.y.z>-SNAPSHOT-<label>`, where
# <label> is that branch's name in letters, digits and hyphens -> npm "<x.y.z>-SNAPSHOT-<label>.<commits>"
# under dist-tag "snapshot-<label>", never "snapshot" or "latest".
#
# Why the branch and not the merge: a version bump reaching main used to publish on its own, which
# made every doc commit on a publish branch a potential npm release and left "[skip publish]" as the
# only brake. Now the trigger is explicit and revocable — a release branch that is never approved
# ships nothing, and a push to any other branch cannot reach the publish job at all.
#
# After the release: `delete_release_branch` deletes `release/v<x.y.z>` once its version is tagged
# (scripts/ci/delete-release-branch.sh, the same script and job as the extension repository). The branch
# is never merged back — it carries nothing `main` lacks, because the bump went through `main` first — and
# the released commit stays reachable from its tag. A branch whose push released nothing is kept: every
# `-SNAPSHOT` branch (never tagged), and a `[skip publish]` commit on top of a released tag.
#
# Opt-out: a commit message containing "[skip publish]" (case-insensitive) makes the publish job a
# no-op — build, tests and the JS dist packaging still run. Less load-bearing than it was, now that
# reaching the job needs a release branch and an approval, but it still lets a fix land on a release
# branch (a changelog typo, a CI tweak) without re-proposing the release. (Contrast with CircleCI's
# own "[skip ci]", which skips the whole pipeline including the tests.)
#
# npm auth = TRUSTED PUBLISHING via OIDC (no stored NPM_TOKEN). The publish job mints a short-lived
# OIDC token (`circleci run oidc get`) for each package, which the npm CLI (>= 11.11.0 for CircleCI) exchanges
# for a publish token scoped to that package. Prerequisites (one-time, for EACH of the two packages):
#   1. The package must have been published once already (bootstrap publish — see the release runbook).
#   2. Configure the Trusted Publisher on npmjs.com → package Settings → Trusted Publishing → CircleCI
#      (needs the CircleCI Org ID, Project ID, Pipeline Definition ID, and VCS origin URL).
# The headless package is published first, so until both are in place for it publish_npm fails before it
# reaches core, and nothing is released.
# Only env var still needed: GITHUB_TOKEN (contents:write) — for the tag + GitHub Release on STABLE
# releases. Snapshots need no secrets at all.

executors:
  jdk-node:
    docker:
      - image: cimg/openjdk:17.0-node
    resource_class: large
  node-publish:
    docker:
      # Trusted publishing needs Node >= 22.14 and, for the CIRCLECI OIDC provider specifically,
      # npm >= 11.11.0 (npm/cli#8925 — the generic 11.5.1 floor only covers GitHub Actions/GitLab;
      # older npm silently skips the token exchange and dies with ENEEDAUTH). Node 24.22.1 bundles
      # npm 11.19.1, so no in-job npm upgrade is normally needed (a version guard in the publish
      # job self-heals if the image's bundled npm ever falls behind).
      - image: cimg/node:24.22.1
    environment:
      REPO_SLUG: dmarket/p2p-tracker-core

commands:
  restore_gradle_cache:
    steps:
      - restore_cache:
          keys:
            # Exact-revision key first, then same-deps fallback, then anything. The revision segment
            # matters because CircleCI's save_cache is a no-op for an existing key: without it the
            # cached Gradle build cache (~/.gradle/caches/build-cache-1) would be frozen at the first
            # build after a dependency bump and source-only commits would never reuse task outputs.
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}-{{ .Revision }}
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}-
            - gradle-v1-
  save_gradle_cache:
    steps:
      - save_cache:
          key: gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}-{{ .Revision }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

jobs:
  # Single Gradle job: `check` and both JS library distributions share one container, one cache
  # restore, one configuration phase, and one set of compiled klibs (a separate package job used to
  # recompile all Kotlin/JS from scratch). The dists + npm packaging also run on non-publish branches
  # — after `check` they are cheap incremental work, and publish_npm stays branch-filtered.
  build_and_test:
    executor: jdk-node
    steps:
      - checkout
      # No separate prover step: the TLSN prover is a pinned npm dependency, and :core:verifyTlsnProver
      # checks it — integrity against the pin committed in build-logic/src/main/kotlin/TlsnProver.kt,
      # version, gitHead == GIT_SHA, SHA256SUMS, WASM_SHA256 — and fails the build on any miss. The JS
      # tests (which run the real wasm) and the copy into each package's distribution depend on it, so
      # nothing executes or ships the package unchecked. Its log line names GIT_SHA, which must match the
      # notary the prover talks to (a mismatch surfaces as an opaque MPC failure, not a clean error). See
      # core/PROVER.md.
      - restore_gradle_cache
      - run:
          name: Check (spotless + JVM/JS tests + kover gate) + both JS library distributions
          command: ./gradlew check :core:jsBrowserProductionLibraryDistribution :headless-js:jsNodeProductionLibraryDistribution --no-daemon --stacktrace
      - save_gradle_cache
      - run:
          name: Collect test results
          when: always
          command: |
            mkdir -p ~/test-results
            find . -path '*/build/test-results/*/*.xml' -exec cp {} ~/test-results/ \; 2>/dev/null || true
      - store_test_results:
          path: ~/test-results
      - run:
          name: Prepare both npm package.json files (name + version + dist-tag) and release.env
          # Each run writes release.env (and appends it to $BASH_ENV). Nothing in it depends on the package,
          # so the two runs must write the same file; the publish job loads one release.env for both.
          command: |
            set -euo pipefail
            bash core/npm/prepare-package.sh headless-js
            cp release.env /tmp/release.headless.env
            bash core/npm/prepare-package.sh core
            if ! cmp release.env /tmp/release.headless.env; then
              echo "ERROR: the two packages were prepared with different release vars:" >&2
              diff /tmp/release.headless.env release.env >&2 || true
              exit 1
            fi
      - run:
          name: Smoke-test the packed headless package as a host installs it
          # The tests import the package from the build directory. What only an installed package exercises —
          # the package root, the default prover files, `ws` as a dependency, the wasm under pkg/, the types —
          # runs here, from the tarball npm would publish, on this image's Node (>= the package's engines).
          # Installs `ws` and typescript from the registry. The tarball stays in /tmp: publish_npm publishes
          # the prepared directory, not this file.
          command: |
            set -euo pipefail
            mkdir -p /tmp/headless-pack
            (cd headless-js/build/dist/js/productionLibrary && npm pack --pack-destination /tmp/headless-pack)
            bash headless-js/npm/smoke/run.sh /tmp/headless-pack/*.tgz /tmp/headless-smoke
      - persist_to_workspace:
          root: .
          paths:
            - headless-js/build/dist/js/productionLibrary
            - core/build/dist/js/productionLibrary
            - release.env

  publish_npm:
    executor: node-publish
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Load release vars
          command: cat release.env >> "$BASH_ENV"
      - run:
          name: Ensure npm supports CircleCI trusted publishing (>= 11.11.0)
          # 11.11.0 is when npm's OIDC flow learned about CircleCI (not the 11.5.1 GA floor, which
          # is GitHub Actions/GitLab only). Normally a no-op version check; the upgrade only runs
          # if the bundled npm is too old, and it pins the npm 11 line (npm 12 wants newer Node ->
          # EBADENGINE risk on image bumps).
          command: |
            REQUIRED="11.11.0"
            CURRENT="$(npm --version)"
            if [ "$(printf '%s\n' "$REQUIRED" "$CURRENT" | sort -V | head -n1)" != "$REQUIRED" ]; then
              echo "npm $CURRENT < $REQUIRED — upgrading to the npm 11 line."
              npm install -g npm@11
            fi
            npm --version
      - run:
          name: Publish both packages to npm via OIDC (+ tag & GitHub Release for stable versions)
          command: |
            set -euo pipefail
            # Headless first, core second. Core is what the web extension consumes, and its users are live:
            # if the headless publish fails, core is not published, so the extension never gets a release
            # whose pair is missing and that has no tag. If core fails after headless, headless waits without
            # a tag, but nothing picks it up on its own: its consumers pin exact versions and move to a new one
            # deliberately. Either way a re-run converges, because each package skips what npm already has.
            PKG_DIRS="headless-js/build/dist/js/productionLibrary core/build/dist/js/productionLibrary"
            echo "Target: $VERSION (dist-tag: $DIST_TAG, snapshot: $IS_SNAPSHOT, branch: $CIRCLE_BRANCH)"

            # --- Opt-out guard: "[skip publish]" in the commit message (resolved in prepare-package.sh). ---
            if [ "${SKIP_PUBLISH:-false}" = "true" ]; then
              echo "Skipping: commit message contains [skip publish] — no npm publish, no tag, no Release."
              exit 0
            fi

            # --- Branch/version agreement: the branch names the version it releases. ---
            # A hard failure, not a skip: reaching this job means a human approved a release, and the
            # only ways to get here disagreeing are a bump that was forgotten or a branch cut from the
            # wrong place. Both would publish a version nobody proposed.
            BRANCH_VERSION="${CIRCLE_BRANCH#release/v}"
            EXPECTED_VERSION="$VERSION_NAME"
            if [ -n "${SNAPSHOT_LABEL:-}" ]; then EXPECTED_VERSION="$VERSION_NAME-$SNAPSHOT_LABEL"; fi
            if [ "$BRANCH_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "ERROR: branch '$CIRCLE_BRANCH' proposes $BRANCH_VERSION but gradle.properties says $VERSION_NAME." >&2
              exit 1
            fi

            # --- Source: only main releases, or publishes the plain `snapshot`. ---
            # A commit main does not have publishes only as a labelled snapshot
            # (`release/v<x.y.z>-SNAPSHOT-<branch>`), under its own dist-tag, so a build of unmerged work can
            # never become `latest` or the `snapshot` every consumer of the dev line pulls.
            if [ -z "${SNAPSHOT_LABEL:-}" ]; then
              git fetch -q origin main
              if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
                echo "ERROR: $CIRCLE_SHA1 is not on main. A branch other than main publishes only a branch snapshot: VERSION_NAME <x.y.z>-SNAPSHOT on release/v<x.y.z>-SNAPSHOT-<branch>." >&2
                exit 1
              fi
            fi

            # --- Changelog guard: a stable release must have a matching CHANGELOG section. ---
            if [ "$IS_SNAPSHOT" = "false" ] && ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
              echo "ERROR: CHANGELOG.md is missing a '## [$VERSION]' section for this stable release." >&2
              exit 1
            fi

            # --- Both distributions are this release's. ---
            # Both come from the one build_and_test run that wrote release.env; a version that differs means
            # the workspace holds a distribution that run did not prepare. Checked for both before either is
            # published, so a stale core is not found only after headless has gone out without it.
            for PKG_DIR in $PKG_DIRS; do
              PKG_VERSION="$(node -p "require('./$PKG_DIR/package.json').version")"
              if [ "$PKG_VERSION" != "$VERSION" ]; then
                echo "ERROR: $PKG_DIR holds version $PKG_VERSION, but this release is $VERSION." >&2
                exit 1
              fi
            done

            for PKG_DIR in $PKG_DIRS; do
              NAME="$(node -p "require('./$PKG_DIR/package.json').name")"

              # --- Idempotency: skip the PUBLISH, not the job. ---
              # Skipping the whole job here is what a re-run after a partial failure would hit: npm has the
              # version, so the tag and Release below would never be created for it — and there is no second
              # chance, because this same guard fires on every later attempt. So each step decides for itself
              # whether its own artefact already exists, and an approved release converges on both packages
              # published WITH the tag however many times it is run.
              if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                echo "$NAME@$VERSION already on npm — skipping its publish."
              else
                # --- OIDC trusted publishing: mint a short-lived id token; npm exchanges it. No stored token. ---
                # A fresh one for each package: npm exchanges it for a publish token for that one package, and
                # whether the same id token is accepted a second time is not something to learn mid-release.
                NPM_ID_TOKEN="$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')"
                export NPM_ID_TOKEN
                (cd "$PKG_DIR" && npm publish --tag "$DIST_TAG" --access public)
                echo "Published $NAME@$VERSION under dist-tag '$DIST_TAG'."
              fi
            done

            # --- Stable releases: annotated tag + GitHub Release from the changelog section. ---
            #
            # The tag is minted HERE, downstream of `hold_release`, and that is the point rather than an
            # implementation detail: a tag is the durable public statement that a version was released, so it
            # must not exist for a release nobody approved. Nothing earlier in this pipeline creates one. It
            # comes after both publishes: a failed one has already ended the job (set -e), so a release that is
            # only half on npm has no tag. One tag and one Release for the two packages, as they share a version.
            if [ "$IS_SNAPSHOT" = "false" ]; then
              git config user.name "circleci-bot"
              git config user.email "ci@dmarket.com"
              # Own idempotency, like the publish above: on a re-run the tag may already be pushed while the
              # Release below is not, and `git tag` would fail the job before that could be repaired.
              if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
                echo "Tag v$VERSION already exists — skipping the tag."
              else
                git tag -a "v$VERSION" -m "Release v$VERSION"
                git push "https://x-access-token:${GITHUB_TOKEN}@github.com/dmarket/p2p-tracker-core.git" "v$VERSION"
                echo "Created git tag v$VERSION."
              fi

              awk "/^## \[$VERSION\]/{f=1;next} /^## \[/{f=0} /^\[[^]]*\]:/{f=0} f" CHANGELOG.md >/tmp/notes.md
              # A hyphenated version is a SemVer prerelease (e.g. 1.0.0-beta.1) — flag the GitHub
              # Release as one. A plain x.y.z stays a full release.
              node -e 'const fs=require("fs");const b=fs.readFileSync("/tmp/notes.md","utf8");const v=process.env.VERSION;const t="v"+v;process.stdout.write(JSON.stringify({tag_name:t,name:t,body:b,draft:false,prerelease:v.includes("-")}))' >/tmp/release.json
              if curl -sSf -o /dev/null \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/dmarket/p2p-tracker-core/releases/tags/v$VERSION" 2>/dev/null; then
                echo "GitHub Release v$VERSION already exists — nothing to create."
              else
                curl -sSf -X POST \
                  -H "Authorization: token ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/dmarket/p2p-tracker-core/releases \
                  -d @/tmp/release.json
                echo "Created GitHub Release v$VERSION."
              fi
            fi

  # The last job of a release: deletes the `release/vX.Y.Z` branch. Last rather than a step inside
  # publish_npm, because publish_npm checks the branch out — and a failed publish is retried by
  # re-running this workflow, which needs the branch to still exist.
  delete_release_branch:
    executor: node-publish
    steps:
      - checkout
      - run:
          name: Delete the release branch
          command: bash scripts/ci/delete-release-branch.sh

  # TODO(Maven Central): when Android/iOS targets land, apply com.vanniktech.maven.publish and add a
  # publish_maven job here (see the POM_* properties in gradle.properties).

workflows:
  ci:
    jobs:
      - build_and_test
      # Releasing is a manual act. Nothing is published, tagged or released until someone approves
      # this, so a push to a release branch is a proposal rather than a publication — and a proposal
      # that is never approved leaves no trace on npm.
      #
      # Scoped to `release/v<x.y.z>`, which is what keeps the approval meaningful: it appears only
      # where releasing is the point. Approving one that releases nothing anyway (the version is
      # already on npm, or the commit says [skip publish]) is still safe — publish_npm prints why and
      # goes green.
      - hold_release:
          type: approval
          requires:
            - build_and_test
          filters: &release_branches
            branches:
              # `release/v1.0.1`, with an optional prerelease suffix (`release/v1.0.1-SNAPSHOT`,
              # `release/v1.1.0-beta.1`). publish_npm then requires gradle.properties' VERSION_NAME
              # to be exactly the part after the `v` — or, for a branch snapshot
              # (`release/v1.0.1-SNAPSHOT-development`), that part minus its `-<label>`.
              only: /^release\/v\d+(\.\d+){0,3}(-[0-9A-Za-z.-]+)?$/
      - publish_npm:
          requires:
            - hold_release
          filters: *release_branches
      - delete_release_branch:
          requires:
            - publish_npm
          filters: *release_branches
