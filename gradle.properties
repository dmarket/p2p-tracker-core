org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# KMP + some publishing tasks aren't configuration-cache safe yet; keep off until verified.
org.gradle.configuration-cache=false

kotlin.code.style=official
# Avoid the multiplatform "experimental" nag in CI logs.
kotlin.mpp.stability.nowarn=true

# ---- Publishing coordinates (vanniktech reads these) --------------------------------
GROUP=com.dmarket.p2p
VERSION_NAME=1.0.0-beta.1

POM_NAME=DMarket P2P Trade-Tracker Core
POM_DESCRIPTION=Shared Kotlin Multiplatform core for the DMarket P2P trade-tracker (web extension, iOS, Android).
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/dmarket/p2p-tracker-core

POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/dmarket/p2p-tracker-core
POM_SCM_CONNECTION=scm:git:git://github.com/dmarket/p2p-tracker-core.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/dmarket/p2p-tracker-core.git

POM_DEVELOPER_ID=dmarket
POM_DEVELOPER_NAME=DMarket
POM_DEVELOPER_URL=https://github.com/dmarket

